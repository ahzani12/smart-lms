server {
    listen 3008;
    root /var/www/smart-lms;
    index index.html;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Connection limit
    limit_conn lms_conn 50;

    # Hide nginx version
    server_tokens off;

    # Block scanner paths
    location ~* \.(env|git|svn|htaccess|htpasswd|DS_Store)$ {
        deny all;
        return 404;
    }
    location ~* /(wp-admin|wp-login|xmlrpc|phpmyadmin|admin\.php) {
        deny all;
        return 404;
    }

    # Login: ANTI BRUTE FORCE (5/menit per IP)
    location = /api/auth/login {
        limit_req zone=lms_login burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Register: extra strict
    location = /api/auth/register {
        limit_req zone=lms_login burst=1 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Uploads
    location /uploads/ {
        limit_req zone=lms_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8085/uploads/;
        proxy_set_header Host $host;
    }

    # API umum
    location /api/ {
        limit_req zone=lms_api burst=20 nodelay;
        limit_req_status 429;

        client_max_body_size 50M;

        proxy_pass http://127.0.0.1:8085/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA static
    location / {
        limit_req zone=lms_general burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
