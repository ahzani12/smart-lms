# Rate limit zones - shared across all server blocks
# Sizing: 1MB ≈ 16,000 IPs tracked

# General traffic: 30 req/sec per IP (handles SPA chunk loading)
limit_req_zone $binary_remote_addr zone=lms_general:10m rate=30r/s;

# API endpoints: 10 req/sec per IP
limit_req_zone $binary_remote_addr zone=lms_api:10m rate=10r/s;

# Login/auth: 5 attempts per minute per IP (anti brute force)
limit_req_zone $binary_remote_addr zone=lms_login:10m rate=5r/m;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=lms_conn:10m;
